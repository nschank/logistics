[user]
name = "Nick Schank"
email = "nicolas.schank@gmail.com"

[ui]
editor = "vim"
diff-editor = ":builtin"

[revset-aliases]
'tip()' = 'exactly(@:: ~ (@::)-, 1)'
'tip(x)' = 'exactly(x:: ~ (x::)-, 1)'
'all_tails()' = 'roots(~::trunk())'
'tails()' = 'all_tails() & mine()'
'tail(x)' = 'all_tails() & ::x'


[aliases]
l = ["log", "-r", "mine()", "--no-pager", "--limit=10"]
npr = ["util", "exec", "--", "bash", "-c", 'name=${0%%@*}; remote=${0#*@}; [ "$remote" = "$0" ] && remote=origin; jj bookmark set nschank/$name && jj bookmark track nschank/$name --remote=$remote']
rmain = ["rebase", "-d", "main@origin", "--skip-emptied"]
nmain = ["new", "main@origin"]
fpr = ["bookmark", "forget"]
bs = ["bookmark", "set", "--allow-backwards"]
dm = ["describe", "-m"]
nm = ["new", "-m"]
pull = ["git", "fetch"]
push = ["git", "push"]
newbase = ["new", "--insert-before=@"]
wu = ["workspace", "update-stale"]
